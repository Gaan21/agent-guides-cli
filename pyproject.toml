[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-guides-cli"
version = "0.1.0.dev1"
description = "Neutral Git-sourced guidance preparation tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.urls]
Repository = "https://github.com/Gaan21/agent-guides-cli"

[project.scripts]
agent-guides-cli = "agent_guides_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools]
include-package-data = false
